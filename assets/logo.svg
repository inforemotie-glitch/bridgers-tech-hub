<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-labelledby="bridgersHubLogoTitle">
  <title id="bridgersHubLogoTitle">Bridgers Tech Hub</title>
  <defs>
    <linearGradient id="bridgersHubCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bridgersHubTag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Bridge spans radiating from the hub -->
  <g stroke="#0F172A" stroke-width="3.2" stroke-linecap="round">
    <path d="M28 28 49.65 15.5M28 28 6.35 15.5M28 28 6.35 40.5M28 28 49.65 40.5"/>
  </g>

  <!-- Interlocking hexagonal hub core -->
  <path d="M28 15.5 38.83 21.75V34.25L28 40.5 17.17 34.25V21.75Z" fill="url(#bridgersHubCore)"/>
  <path d="M35 28 31.5 34.06H24.5L21 28 24.5 21.94H31.5Z" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 24.6 30.94 26.3V29.7L28 31.4 25.06 29.7V26.3Z" fill="#F97316"/>

  <!-- Four bridge nodes -->
  <path d="M49.65 9.9 54.5 12.7V18.3L49.65 21.1 44.8 18.3V12.7Z" fill="#F97316"/>
  <path d="M6.35 9.9 11.2 12.7V18.3L6.35 21.1 1.5 18.3V12.7Z" fill="#0891B2"/>
  <path d="M6.35 34.9 11.2 37.7V43.3L6.35 46.1 1.5 43.3V37.7Z" fill="#F97316"/>
  <path d="M49.65 34.9 54.5 37.7V43.3L49.65 46.1 44.8 43.3V37.7Z" fill="#0891B2"/>
  <g fill="#FFFFFF">
    <circle cx="49.65" cy="15.5" r="1.7"/>
    <circle cx="6.35" cy="15.5" r="1.7"/>
    <circle cx="6.35" cy="40.5" r="1.7"/>
    <circle cx="49.65" cy="40.5" r="1.7"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="28" textLength="170" lengthAdjust="spacing" font-family="'Outfit', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">BRIDGERS</text>

  <!-- Tech Hub accent tag with bridge rail -->
  <rect x="66" y="34.5" width="88" height="17" rx="3.5" fill="url(#bridgersHubTag)"/>
  <text x="110" y="46.6" text-anchor="middle" textLength="66" lengthAdjust="spacing" font-family="'Outfit', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">TECH HUB</text>
  <path d="M160 43H228" stroke="#0891B2" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M231.5 38.4 235.5 40.7V45.3L231.5 47.6 227.5 45.3V40.7Z" fill="#0891B2"/>
  <circle cx="231.5" cy="43" r="1.4" fill="#FFFFFF"/>
</svg>
